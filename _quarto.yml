project:
  type: website
  output-dir: _site

website:
  title: "Frederic OKE-AGBO"
  description: "Notes, tutorials and projects on machine learning and data science."
  site-url: "https://ouo15.github.io"
  repo-url: "https://github.com/Ouo15/Ouo15.github.io"
  favicon: images/favicon.svg
  open-graph: true
  navbar:
    title: "Frederic OKE-AGBO"
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: blog.qmd
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/Ouo15
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/frederic-oke-agbo-ms-mph-asa-289ba434
        aria-label: LinkedIn
      - icon: envelope
        href: "mailto:fredook15@gmail.com"
